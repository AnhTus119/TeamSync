<!doctype html>
<!-- FILE DÙNG CHUNG: layout + menu. Trang của module nằm trong templates/<module>/ và chỉ ghi đè block content/scripts. -->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TeamSync{% endblock %} — TeamSync</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="/">TeamSync</a>
    {% if me %}
    <div class="navbar-nav">
      <a class="nav-link" href="{{ url_for('m06_pages.projects') }}">Dự án</a>
      <a class="nav-link" href="{{ url_for('m20_pages.workspaces') }}">Không gian làm việc</a>
      {% if me.role == 'admin' %}<a class="nav-link" href="{{ url_for('m20_pages.admin_users') }}">Quản trị</a>{% endif %}
    </div>
    <div class="ms-auto d-flex align-items-center gap-2">
      <a class="text-white small text-decoration-none" href="{{ url_for('m20_pages.account') }}">{{ me.full_name }}</a>
      <button id="nav-logout" class="btn btn-sm btn-outline-light">Đăng xuất</button>
    </div>
    {% else %}
    <div class="ms-auto"><a class="btn btn-sm btn-light" href="{{ url_for('m20_pages.login') }}">Đăng nhập</a></div>
    {% endif %}
  </div>
</nav>
<main class="container pb-5">
  <div id="alert-box"></div>
  {% block content %}{% endblock %}
</main>
<script>window.ME = {{ (me.to_dict() if me else None) | tojson }};</script>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
