<!doctype html>
<!-- FILE DÙNG CHUNG: layout + menu. Trang của module nào nằm trong templates/<module>/ và chỉ ghi đè block content/scripts. -->
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TeamSync{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand navbar-dark bg-primary mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">TeamSync</a>
    <div class="navbar-nav">
      <a class="nav-link" href="{{ url_for('m10_pages.courses') }}">Lớp & dự án</a>
      <a class="nav-link" href="{{ url_for('m20_pages.admin_users') }}">Quản trị</a>
    </div>
    <div class="ms-auto d-flex align-items-center gap-2">
      <span id="nav-user" class="text-white small"></span>
      <button id="nav-logout" class="btn btn-sm btn-outline-light d-none">Đăng xuất</button>
      <a id="nav-login" class="btn btn-sm btn-light" href="{{ url_for('m20_pages.login') }}">Đăng nhập</a>
    </div>
  </div>
</nav>
<main class="container">
  <div id="alert-box"></div>
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
