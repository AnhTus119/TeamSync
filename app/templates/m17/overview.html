{% extends "base.html" %}
{% block title %}Tổng quan không gian làm việc{% endblock %}
{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/m17.css') }}">
<div id="m17-overview" class="m17-page" data-workspace-id="{{ workspace_id }}">
  <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
    <div>
      <div class="small text-muted"><a href="/workspaces/{{ workspace_id }}" class="text-decoration-none">← Không gian làm việc</a></div>
      <h1 class="h4 mb-0" id="m17-ws-title">Tổng quan tiến độ</h1>
    </div>
    <span class="m17-pill blue"><i class="bi bi-eye"></i>Dành cho chủ không gian làm việc / giám sát</span>
  </div>
  <div id="m17-error" class="alert alert-danger" hidden></div>
  <div id="m17-ov-totals" class="row g-3 mb-4"><div class="col-12"><div class="m17-skel h-md"></div></div></div>
  <div id="m17-ov-projects" class="row g-3"></div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/m17.js') }}"></script>{% endblock %}
